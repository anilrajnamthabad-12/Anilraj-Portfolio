<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <rect width="500" height="500" rx="250" fill="url(#bgGradient)" />

  <!-- Outer Glow Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#accentGlow)" stroke-width="4" stroke-opacity="0.8" filter="url(#glow)" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#accentGlow)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.4" />

  <!-- Abstract Developer Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 120 420 C 130 330, 200 310, 250 310 C 300 310, 370 330, 380 420 Z" fill="url(#avatarGradient)" stroke="#6366f1" stroke-width="2" />
  
  <!-- Collar / Shirt Detail -->
  <path d="M 220 315 L 250 360 L 280 315" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
  
  <!-- Head / Face Silhouette -->
  <circle cx="250" cy="220" r="75" fill="url(#avatarGradient)" stroke="#8b5cf6" stroke-width="2" />

  <!-- Tech Code Overlay Badges -->
  <!-- Left Code Bracket < / > -->
  <g transform="translate(60, 200)">
    <rect width="54" height="54" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <text x="27" y="34" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Right Terminal Badge { } -->
  <g transform="translate(386, 200)">
    <rect width="54" height="54" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <text x="27" y="34" font-family="monospace" font-size="22" font-weight="bold" fill="#a855f7" text-anchor="middle">{;}</text>
  </g>

  <!-- Python Tech Dot Bottom Left -->
  <g transform="translate(100, 350)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Py</text>
  </g>

  <!-- SQL Tech Dot Bottom Right -->
  <g transform="translate(360, 350)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">SQL</text>
  </g>

  <!-- Center Monogram Label -->
  <rect x="180" y="445" width="140" height="34" rx="17" fill="#0f172a" stroke="url(#accentGlow)" stroke-width="1.5" />
  <text x="250" y="468" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">ANIL RAJ</text>
</svg>
